extends: default.yaml
stage: stage1b

semantic:
  version: stage1b-transformer/v1
  enabled_parameters:
    - AoI_seconds
    - freshness
    - novelty
    - relevance
    - reliability
    - urgency
    - task_importance
  freshness_tau_seconds: 10.0
  clip_temperature: 0.07
  snr_db: 10.0
  rate: 96
  clip:
    model_name: openai/clip-vit-base-patch32
    # Set true on an offline machine after the model has been cached locally.
    local_files_only: false
  concept_prompts:
    fire: a building fire or visible flames
    smoke: smoke from an emergency incident
    pedestrian: a pedestrian near a road
    traffic_light: a traffic light at an intersection
    vehicle: a road vehicle or car
    road: a road or urban street
    animal: an animal in a scene
    building: a building or urban structure
    vegetation: plants, trees, or a flower

# These timestamps and deadlines are explicit demonstration metadata. They are
# not inferred from image names, modification time, or image pixels.
demo:
  image_root: Test/images
  reference_now: "2026-09-16T00:05:00+00:00"
  task:
    task_id: emergency_building_fire
    task_text: detect building fires and smoke for emergency response
    urgency_horizon_seconds: 60.0
    concept_importance:
      fire: 0.95
      smoke: 0.90
      pedestrian: 0.85
      traffic_light: 0.80
      vehicle: 0.75
      road: 0.70
      animal: 0.45
      building: 0.35
      vegetation: 0.20
  images:
    - filename: BuildingFire.jpeg
      label: Building fire
      captured_at: "2026-09-16T00:04:55+00:00"
      deadline_at: "2026-09-16T00:05:20+00:00"
    - filename: BuildingFire2.jpeg
      label: Building fire follow-up
      captured_at: "2026-09-16T00:04:40+00:00"
      deadline_at: "2026-09-16T00:05:10+00:00"
    - filename: Mumbai-Drone-Photo-1.jpeg
      label: Mumbai drone scene
      captured_at: "2026-09-16T00:04:05+00:00"
      deadline_at: "2026-09-16T00:06:40+00:00"
    - filename: sunflower.jpeg
      label: Sunflower scene
      captured_at: "2026-09-16T00:03:00+00:00"
