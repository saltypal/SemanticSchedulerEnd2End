# Dataset, label mapping and split policy for the edge decoder scheduler (plan v3.1 sec. 3).
# Every rule here is a documented design choice; change it here, never in code.
crisismmd:
  metadata_revision: "10a5626ba112ab9c50369c473a2062bcf205d708"   # QCRI/CrisisMMD on HuggingFace
  tasks: [informative, humanitarian, damage]
  native_splits: [train, dev, test]
  kaggle_dataset: "seaninggg/crisismmd-multimodal-crisis-dataset"   # attached to notebook A; images found by folder under /kaggle/input

# First matching tier wins, top to bottom. Values are the native CrisisMMD label strings.
tier_rules:
  Critical:
    damage: [severe_damage]
    humanitarian: [injured_or_dead_people, missing_or_found_people]   # life-safety override
  # Only 3,526 of 18,082 CrisisMMD images carry a damage label, so humanitarian labels fill in (plan v3 sec. 3 is
  # stated on damage labels): infrastructure/vehicle damage count as High (damage seen, severity unknown).
  High:
    damage: [mild_damage]
    humanitarian: [infrastructure_and_utility_damage, vehicle_damage]
  Medium:
    damage: [little_or_no_damage]
    # affected_individuals is Medium here and High only in the v3 sensitivity mapping below (aligned 2026-11-11)
    humanitarian: [affected_individuals, rescue_volunteering_or_donation_effort, other_relevant_information]
    requires_informative: true     # Medium via humanitarian needs informative == informative
  Low:
    default: true                  # not informative / not_humanitarian / unmatched

# Sensitivity mapping (plan v3 sec. 3, reported in an appendix): affected_individuals -> High.
alternative_mappings:
  affected_high:
    High:
      humanitarian_add: [affected_individuals]

normals:
  # Places365 categories that look like damage; excluded so rubble-like scenes are never labelled Low.
  places365_blacklist: [ruin, junkyard, landfill, construction_site, excavation, volcano, dam]
  source_tier: Low
  # Kaggle datasets, attached as notebook inputs (read-only mounts under /kaggle/input).
  places365_kaggle_dataset: benjaminkz/places365   # CC0; train/<class>/<name>.jpg
  places365_split: val             # Kaggle benjaminkz/places365 folder: val (~100 img/class, fast) or train; falls back to train if absent
  places365_per_class: 17          # stratified: this many images from EVERY class (about 6,200 over 365 classes)
  coco_kaggle_dataset: awsaf49/coco-2017-dataset   # people images from train2017 + person_keypoints_train2017.json
  people_count: 3000
  coco_min_person_area_frac: 0.05  # keep images with a person box >= this fraction of the image area
  seed: 29
  sources:                         # fallback ONLY, used when the Places365 Kaggle dataset is not mounted
    places365_filelist: https://data.csail.mit.edu/places/places365/filelist_places365-standard.tar
    places365_categories: https://raw.githubusercontent.com/csailvision/places365/master/categories_places365.txt

splits:
  # Event-disjoint. Final choice is made by report_counts() gates, see sec. 10 S0.
  # Sri Lanka has only 71 Critical (gate 100), so validation is California wildfires (S0 fallback).
  train_events: [hurricane_harvey, hurricane_irma, iraq_iran_earthquake, srilanka_floods]
  val_events: [california_wildfires]
  test_events: [hurricane_maria, mexico_earthquake]
  normals_split: [0.6, 0.1, 0.3]   # train / val / test fractions for event-less everyday images
  # S2b: a val/test image is dropped if it is within these Hamming distances of ANY train image.
  # Chosen from the measured min-distance histogram (2026-11-11): pHash has a gap after 8 bits (copies) before
  # the bulk at 12-16; SimHash has no gap (crisis photos are semantically close), so only 0-1 bits = copies.
  dedup:
    phash_max: 8
    simhash_max: 1
  dup_pair_candidates: 400        # S2c: pairs from train+val for human duplicate/distinct labels
  dup_pair_seed: 22
  gates:
    min_test_critical: 150
    min_val_critical: 100
