# Simulator, value function and constraint settings (plan v3.1 sec. 5, 6, 9). Times in seconds.
tiers: [Critical, High, Medium, Low]
soft_deadline_s:   [5, 15, 60, 300]     # D_k; hard deadline H_k = 2 * D_k
hard_deadline_factor: 2.0
weights:           [8, 4, 2, 1]         # w_k, swept x0.5 / x2 in sensitivity runs
eta_timely:        [0.95, 0.85, 0.60, 0.20]   # per-tier timeliness targets
zeta_critical_copy: 0.25                # value of a later copy of a Critical image
workers: [1, 2, 4, 6, 8]
batch_sizes: [1, 2, 4, 8]
loads_rho: [0.6, 0.8, 1.0, 1.2, 1.5]
realisations: 10
warmup_fraction: 0.10
dup:
  hard_purge_prob: 0.99                 # purge only if delivered copy exists and P(dup) above this
sv_dpp:
  V: 0.1                        # S7 tune grid on val (V x hard_purge_prob): best V = 0.1
  debt_init: 0.0
  # sec. 6.3 tie rule: scores below this fraction of max E[v] count as ties (ranked by E[v]).
  # 0.3 = val-tuned (1000 val rows, trace arrivals, TRUE v1 latency, 5 realisations, workers 1/2):
  # sum of CTR@D over rho 1.2/1.5 x workers 1/2 = 1.048 (0.3) vs 1.004 (0.1) vs 0.981 (0.2); rho 0.8 also best (0.379/0.511).
  tie_tol_frac: 0.5            # F6 (2026-11-14, 1000 val, c=2, rho 1.2, 3 runs): 0.5 best at every beta
  relevance_beta: 1.0          # D18, F6-tuned: beta 1.0 / tie 0.5 -> CTR@D 0.825 (beta 0: 0.787)
  # per mission id [lo, hi] for r_tilde = clip((relevance - lo) / (hi - lo), 0, 1).
  # [0.52, 0.68] = observed min/max of relevance in the sim table; replace with per-mission
  # 5th/95th percentiles from the train split.
  relevance_range: {0: [0.52, 0.68], 1: [0.52, 0.68], 2: [0.52, 0.68], 3: [0.52, 0.68]}

# Arrival model and named scenarios (selectable with --scenario NAME ...; later names override earlier).
# Knobs are documented in Evaluation/edge/regimes.py. Default (no scenario) = synthetic Poisson.
arrival: poisson                       # poisson | mmpp | trace (v3 sec. 9; trace = tweet-time order, kappa-compressed)
mmpp: {low: 0.3, high: 1.7, switch_rate: 0.05}
scenarios:
  # I10 / v3 sec. 7 teacher-misspecified regimes (apply on val)
  mmpp_bursts: {arrival: mmpp}
  wrong_sigma_w_low: {sigma_w_scale: 0.25}     # policy believes latency is much less variable
  wrong_sigma_w_high: {sigma_w_scale: 4.0}     # policy believes latency is much more variable
  noisy_spi_10: {spi_noise: 0.10}              # 10 % of SPI posteriors confidently wrong
  noisy_spi_20: {spi_noise: 0.20}
  # I13 sensitivity rows
  tier_alt: {tier_key: tier_alt}               # truth = affected->High mapping
  critical_share_x2: {critical_share: 2.0}
  critical_share_x0_5: {critical_share: 0.5}
  weights_x0_5: {weights_scale: 0.5}
  weights_x2: {weights_scale: 2.0}
  loss_1pct: {loss: 0.01}
  loss_3pct: {loss: 0.03}
  loss_5pct: {loss: 0.05}
  capture_jitter_30s: {capture_jitter_s: 30.0}
  capture_jitter_120s: {capture_jitter_s: 120.0}
  # digital uplink sensitivity (narrowband disaster link, 10 kHz; regimes.apply_link)
  awgn_snr10: {link: {model: awgn, snr_db: 10, bandwidth_hz: 10000}}
  awgn_snr0: {link: {model: awgn, snr_db: 0, bandwidth_hz: 10000}}
  rayleigh_snr20: {link: {model: rayleigh, snr_db: 20, bandwidth_hz: 10000}}
  rayleigh_snr10: {link: {model: rayleigh, snr_db: 10, bandwidth_hz: 10000}}
  rayleigh_snr0: {link: {model: rayleigh, snr_db: 0, bandwidth_hz: 10000}}
