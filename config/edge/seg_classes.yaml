# Project segmentation class map for SQ-GAN pseudo-labels (see Codec/edge/seg_map.py).
# 20 channels = 19 classes + null, the shape SQ-GAN expects (Semantic_Lossless src/sqgan_train.py:83 one_hot 20).
# Indices 6 and 7 MUST stay traffic_light / traffic_sign: the trainer builds its small-object mask from ids 6,7 (sqgan_train.py:84).
# Channel 19 MUST stay null (loss slices semantic[:, :-1], sqgan_train.py:19).

teacher_label_count: 150   # ADE20K SceneParsing; verified against the teacher's id2label at run time

classes:
  - {id: 0, name: road}
  - {id: 1, name: sidewalk}
  - {id: 2, name: building}
  - {id: 3, name: wall}
  - {id: 4, name: fence}
  - {id: 5, name: pole}
  - {id: 6, name: traffic_light}
  - {id: 7, name: traffic_sign}
  - {id: 8, name: vegetation}
  - {id: 9, name: terrain}
  - {id: 10, name: sky}
  - {id: 11, name: person}
  - {id: 12, name: water}   # DECISION: replaces Cityscapes 'rider' (12) so flood water is representable; merge rider into person.
  - {id: 13, name: car}
  - {id: 14, name: truck}
  - {id: 15, name: bus}
  - {id: 16, name: boat}   # DECISION: replaces Cityscapes 'train' (16); boats matter in floods. Alternative: 'debris'.
  - {id: 17, name: motorcycle}
  - {id: 18, name: bicycle}
  - {id: 19, name: "null"}   # DECISION: unmapped/indoor ADE classes go here (alternative: map to building).

# One row per ADE20K id. 'to' must be a name from classes. '# DECISION:' rows need the teammate's call.
