# Codec versions used by the pipeline. v1 is filled when the fine-tuned SQ-GAN bundle is uploaded.
# A bundle is the folder produced by the SQ-GAN training run: bundle.json (algorithm: sqgan,
# pipeline_completed: true, files: [{path, bytes, sha256}]), last.pt and assets/checkpoint.
# Codec/integration/sqgan_payload.py verifies every file's size and sha256 against bundle.json.
codecs:
  v0:
    description: "Existing fine-tuned bundle (teammate run 20261028T130100Z-eea4f3aa, Cityscapes classes)"
    kaggle_dataset: ""            # TODO: upload bundle as a Kaggle dataset, e.g. satyapaladugu/edge-sqgan-v0
    bundle_subdir: ""             # path inside the dataset to the folder holding bundle.json
    last_pt_sha256: "706396402d86e84276393ce3fe39f0b0b1b545ff024c0ecae3b8ab72d22f3d6d"
    image_fraction: 0.25
    semantic_fraction: 0.25
    sts_profile: 1                # header version 1: Cityscapes 7-class STS
  v1:
    description: "Fine-tuned on CrisisMMD-train + Places365-train with ADE20K-merged 20 classes"
    kaggle_dataset: ""            # TODO: e.g. satyapaladugu/edge-sqgan-v1  (teammate uploads)
    bundle_subdir: ""
    last_pt_sha256: ""            # TODO: fill after training
    image_fraction: 0.25
    semantic_fraction: 0.25
    sts_profile: 2                # header version 2: new class map
