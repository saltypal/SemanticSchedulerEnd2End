[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-scheduler-end2end"
version = "0.2.0"
description = "Corrected Stage 1A communication and modular Stage 1B semantic-header research prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10,<12",
    "PyYAML>=6,<7",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.8,<4",
    "timm>=1.0.28,<2",
]

[project.optional-dependencies]
metrics = ["scikit-image>=0.24,<1"]
benchmark = [
    "lpips>=0.1.4,<0.2",
    "pandas>=2.2,<4",
    "psutil>=6,<8",
]
test = ["pytest>=8,<9"]
stage1b = [
    "networkx>=3.3,<4",
    "transformers>=4.46,<5",
    "psutil>=5.9,<7",
]
notebook = [
    "ipykernel>=6.29,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "jupyterlab>=4.3,<5",
    "pandas>=2.2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["Test/tests"]
addopts = "-ra"
