[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-scheduler-end2end"
version = "0.1.0"
description = "Corrected modern PyTorch Stage 1A semantic communication research port"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10,<12",
    "PyYAML>=6,<7",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.8,<4",
    "timm>=1.0.28,<2",
]

[project.optional-dependencies]
metrics = ["scikit-image>=0.24,<1"]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["Test/tests"]
addopts = "-ra"
