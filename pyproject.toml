[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-scheduler-end2end"
version = "0.3.0"
description = "Modular semantic-aware communication and scheduling research system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
latent-scheduler = "INFRA.latent.cli:main"

[project.optional-dependencies]
encdec = ["numpy>=1.26,<3", "Pillow>=10,<12", "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4", "timm>=1.0.28,<2"]
semparam = ["numpy>=1.26,<3", "Pillow>=10,<12", "networkx>=3.3,<4", "transformers>=4.46,<5", "scikit-learn>=1.5,<2"]
scheduler = ["matplotlib>=3.8,<4"]
metrics = ["scikit-image>=0.24,<1"]
benchmark = [
    "lpips>=0.1.4,<0.2",
    "pandas>=2.2,<4",
    "psutil>=6,<8",
]
test = ["pytest>=8,<9"]
stage1b = [
    "networkx>=3.3,<4",
    "transformers>=4.46,<5",
    "psutil>=5.9,<7",
]
notebook = [
    "ipykernel>=6.29,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "jupyterlab>=4.3,<5",
    "pandas>=2.2,<3",
]

[tool.setuptools]
package-dir = {"EncDec"="EncDec", "SemParam"="SemParam", "Scheduler"="Scheduler", "INFRA"="INFRA", "scripts"="scripts", "semcom_benchmark"="semcom_benchmark", "EncDecPipeline"="src/EncDecPipeline", "TransformerPipeline"="src/TransformerPipeline", "CodebookParam"="src/CodebookParam", "Channels"="src/Channels", "Baselines"="src/Baselines", "Evaluation"="src/Evaluation", "utils"="src/utils"}

[tool.setuptools.package-data]
"*" = ["config/*.yaml", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["Test/tests", "EncDec/tests", "SemParam/tests", "Scheduler/tests", "INFRA/tests"]
pythonpath = [".", "src"]
addopts = "-ra"
