<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px Arial, sans-serif; fill: #334155; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .box-body { font: 400 14px Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#bg)"/>
  <text x="70" y="62" class="title">Semantic Parameter Extraction → Fixed Scheduler Header</text>
  <text x="70" y="92" class="subtitle">Rich visual evidence is extracted first; only compact numeric features are sent to the latent scheduler.</text>

  <!-- Input -->
  <rect x="60" y="170" width="220" height="130" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="170" y="207" text-anchor="middle" class="box-title">Incoming image</text>
  <text x="170" y="235" text-anchor="middle" class="box-body">car_Fire.jpg</text>
  <text x="170" y="258" text-anchor="middle" class="box-body">image ID + timestamp</text>
  <text x="170" y="281" text-anchor="middle" class="tiny">resize, RGB conversion, hash</text>

  <!-- Shared embeddings -->
  <rect x="340" y="145" width="280" height="180" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="480" y="182" text-anchor="middle" class="box-title">Global visual representation</text>
  <text x="480" y="211" text-anchor="middle" class="box-body">CLIP / SigLIP image encoder</text>
  <text x="480" y="238" text-anchor="middle" class="box-body">normalized image embedding</text>
  <text x="480" y="273" text-anchor="middle" class="small">reused for task matching,</text>
  <text x="480" y="294" text-anchor="middle" class="small">novelty, and candidate concepts</text>

  <!-- Detection -->
  <rect x="340" y="385" width="280" height="180" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="480" y="422" text-anchor="middle" class="box-title">Open-vocabulary detection</text>
  <text x="480" y="451" text-anchor="middle" class="box-body">YOLO-World / Grounding DINO</text>
  <text x="480" y="478" text-anchor="middle" class="box-body">labels + boxes + confidence</text>
  <text x="480" y="513" text-anchor="middle" class="small">car, flame, smoke, person,</text>
  <text x="480" y="534" text-anchor="middle" class="small">road, building, debris, etc.</text>

  <!-- Segmentation -->
  <rect x="700" y="385" width="245" height="180" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="822" y="422" text-anchor="middle" class="box-title">Selective segmentation</text>
  <text x="822" y="451" text-anchor="middle" class="box-body">SAM2</text>
  <text x="822" y="478" text-anchor="middle" class="box-body">pixel masks and area</text>
  <text x="822" y="513" text-anchor="middle" class="small">used for overlap, coverage,</text>
  <text x="822" y="534" text-anchor="middle" class="small">and extent of effect</text>

  <!-- Relations -->
  <rect x="1010" y="385" width="270" height="180" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1145" y="422" text-anchor="middle" class="box-title">Spatial relation engine</text>
  <text x="1145" y="451" text-anchor="middle" class="box-body">boxes + masks + geometry</text>
  <text x="1145" y="478" text-anchor="middle" class="box-body">scene graph relations</text>
  <text x="1145" y="513" text-anchor="middle" class="small">flame overlaps car</text>
  <text x="1145" y="534" text-anchor="middle" class="small">person near vehicle</text>

  <!-- Event reasoning -->
  <rect x="1345" y="385" width="270" height="180" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1480" y="422" text-anchor="middle" class="box-title">Event reasoning</text>
  <text x="1480" y="451" text-anchor="middle" class="box-body">scene + entities + relations</text>
  <text x="1480" y="478" text-anchor="middle" class="box-body">event classifier / rules</text>
  <text x="1480" y="513" text-anchor="middle" class="small">vehicle fire, collision,</text>
  <text x="1480" y="534" text-anchor="middle" class="small">flooding, obstruction, etc.</text>

  <!-- arrows top path -->
  <path d="M280 235 L340 235" class="arrow"/>
  <path d="M620 235 L690 235 L690 385" class="arrow dashed"/>
  <path d="M280 260 L320 260 L320 475 L340 475" class="arrow"/>
  <path d="M620 475 L700 475" class="arrow"/>
  <path d="M945 475 L1010 475" class="arrow"/>
  <path d="M1280 475 L1345 475" class="arrow"/>

  <!-- Parameter cards -->
  <text x="70" y="635" class="section">Parameter formation</text>

  <rect x="60" y="665" width="250" height="135" rx="16" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="185" y="698" text-anchor="middle" class="box-title">1. Scene</text>
  <text x="185" y="724" text-anchor="middle" class="box-body">scene_id + scene_score</text>
  <text x="185" y="752" text-anchor="middle" class="small">Places365 / CLIP / SigLIP</text>
  <text x="185" y="775" text-anchor="middle" class="tiny">broad setting or situation</text>

  <rect x="335" y="665" width="250" height="135" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="698" text-anchor="middle" class="box-title">2. Entities</text>
  <text x="460" y="724" text-anchor="middle" class="box-body">count + top-k summary</text>
  <text x="460" y="752" text-anchor="middle" class="small">YOLO-World / DINO + SAM2</text>
  <text x="460" y="775" text-anchor="middle" class="tiny">what is present</text>

  <rect x="610" y="665" width="250" height="135" rx="16" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="735" y="698" text-anchor="middle" class="box-title">3. Event</text>
  <text x="735" y="724" text-anchor="middle" class="box-body">event_id + event_belief</text>
  <text x="735" y="752" text-anchor="middle" class="small">event head / evidence rules</text>
  <text x="735" y="775" text-anchor="middle" class="tiny">what may be happening</text>

  <rect x="885" y="665" width="250" height="135" rx="16" fill="#ffffff" stroke="#ca8a04" stroke-width="2"/>
  <text x="1010" y="698" text-anchor="middle" class="box-title">4. Relations</text>
  <text x="1010" y="724" text-anchor="middle" class="box-body">relation summary + score</text>
  <text x="1010" y="752" text-anchor="middle" class="small">box/mask geometry</text>
  <text x="1010" y="775" text-anchor="middle" class="tiny">how entities interact</text>

  <rect x="1160" y="665" width="250" height="135" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1285" y="698" text-anchor="middle" class="box-title">5. Context relevance</text>
  <text x="1285" y="724" text-anchor="middle" class="box-body">cos(task, evidence)</text>
  <text x="1285" y="752" text-anchor="middle" class="small">CLIP/SigLIP + task profile</text>
  <text x="1285" y="775" text-anchor="middle" class="tiny">usefulness for current task</text>

  <rect x="1435" y="665" width="250" height="135" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1560" y="698" text-anchor="middle" class="box-title">6. Novelty</text>
  <text x="1560" y="724" text-anchor="middle" class="box-body">distance from history</text>
  <text x="1560" y="752" text-anchor="middle" class="small">knowledge base + embeddings</text>
  <text x="1560" y="775" text-anchor="middle" class="tiny">new information vs duplicate</text>

  <rect x="60" y="835" width="250" height="135" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="185" y="868" text-anchor="middle" class="box-title">7. Task impact</text>
  <text x="185" y="894" text-anchor="middle" class="box-body">consequence score</text>
  <text x="185" y="922" text-anchor="middle" class="small">task profile + event belief</text>
  <text x="185" y="945" text-anchor="middle" class="tiny">cost if missed or delayed</text>

  <rect x="335" y="835" width="250" height="135" rx="16" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
  <text x="460" y="868" text-anchor="middle" class="box-title">8. Urgency</text>
  <text x="460" y="894" text-anchor="middle" class="box-body">time-sensitivity score</text>
  <text x="460" y="922" text-anchor="middle" class="small">policy / trained urgency head</text>
  <text x="460" y="945" text-anchor="middle" class="tiny">how quickly value decays</text>

  <rect x="610" y="835" width="250" height="135" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="735" y="868" text-anchor="middle" class="box-title">9. Evidence sufficiency</text>
  <text x="735" y="894" text-anchor="middle" class="box-body">quality / answerability</text>
  <text x="735" y="922" text-anchor="middle" class="small">quality metrics + calibration</text>
  <text x="735" y="945" text-anchor="middle" class="tiny">enough usable evidence?</text>

  <rect x="885" y="835" width="250" height="135" rx="16" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
  <text x="1010" y="868" text-anchor="middle" class="box-title">10. Interpretation confidence</text>
  <text x="1010" y="894" text-anchor="middle" class="box-body">calibrated trust score</text>
  <text x="1010" y="922" text-anchor="middle" class="small">model agreement + calibration</text>
  <text x="1010" y="945" text-anchor="middle" class="tiny">how much to trust inference</text>

  <rect x="1160" y="835" width="250" height="135" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1285" y="868" text-anchor="middle" class="box-title">11. Extent of effect</text>
  <text x="1285" y="894" text-anchor="middle" class="box-body">area, count, or spread</text>
  <text x="1285" y="922" text-anchor="middle" class="small">SAM2 masks + geometry</text>
  <text x="1285" y="945" text-anchor="middle" class="tiny">deferred in first RL milestone</text>

  <!-- right-side header and scheduler -->
  <rect x="1435" y="835" width="320" height="135" rx="18" fill="url(#header)" filter="url(#shadow)"/>
  <text x="1595" y="868" text-anchor="middle" style="font:700 19px Arial;fill:white">Immutable semantic header</text>
  <text x="1595" y="897" text-anchor="middle" style="font:400 14px Arial;fill:#e0e7ff">context, novelty, impact, urgency</text>
  <text x="1595" y="920" text-anchor="middle" style="font:400 14px Arial;fill:#e0e7ff">sufficiency, confidence, event evidence</text>
  <text x="1595" y="946" text-anchor="middle" style="font:700 15px Arial;fill:white">→ latent scheduler / RL policy</text>

  <!-- connecting flow into header -->
  <path d="M185 800 L185 835" class="arrow"/>
  <path d="M460 800 L460 835" class="arrow"/>
  <path d="M735 800 L735 835" class="arrow"/>
  <path d="M1010 800 L1010 835" class="arrow"/>
  <path d="M1285 800 L1285 835" class="arrow"/>
  <path d="M1560 800 L1560 835" class="arrow"/>
  <path d="M310 902 L1435 902" class="arrow dashed"/>
  <path d="M1410 902 L1435 902" class="arrow"/>

  <!-- Legend -->
  <rect x="60" y="1010" width="1695" height="72" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="90" cy="1046" r="8" fill="#2563eb"/><text x="108" y="1051" class="small">model evidence</text>
  <circle cx="270" cy="1046" r="8" fill="#ca8a04"/><text x="288" y="1051" class="small">derived reasoning</text>
  <circle cx="460" cy="1046" r="8" fill="#7c3aed"/><text x="478" y="1051" class="small">task/knowledge-base signal</text>
  <circle cx="735" cy="1046" r="8" fill="#16a34a"/><text x="753" y="1051" class="small">quality/calibration</text>
  <text x="1030" y="1051" class="small">First RL milestone: novelty + context relevance + impact + urgency + sufficiency.</text>
</svg>
